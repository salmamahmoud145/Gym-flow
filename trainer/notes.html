<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member notes - GymFlow</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="../index.html"><span class="brand-mark">G</span>GymFlow</a>
      <nav class="nav" aria-label="Trainer navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="my_classes.html">My classes &amp; rosters</a>
        <a class="is-active" href="notes.html">Member notes</a>
        <a class="btn btn-accent btn-sm" href="../login.html">Log out</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1 class="page-title">Member notes</h1>
      <p class="page-sub">Review progress and record coaching notes for your members.</p>
    </div>

    <div class="grid cols-2">
      <section class="panel">
        <h2 class="panel-title">Add a note</h2>
        <div class="field">
          <label for="member_id">Member</label>
          <select class="select" id="member_id" name="member_id">
            <option value="">-- choose --</option>
            <option value="1" selected>John Member</option>
          </select>
        </div>
        <form id="note-form">
          <div class="field">
            <label for="note">New note</label>
            <textarea class="textarea" id="note" name="note" rows="3" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Save note</button>
        </form>
        <p id="note-status" class="field-hint" role="status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <h2 class="panel-title">Previous notes</h2>
        <div id="notes-list">
          <p data-note data-created-at="2026-10-18T10:00:00" data-text="Great progress on flexibility and movement.">
            <small>2026-10-18 10:00:00</small><br>
            Great progress on flexibility and movement.
          </p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">GymFlow. Software Engineering project, Phase 1 prototype.</footer>
  <script src="../assets/css/js/member-notes.js"></script>
</body>
</html>
