<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rooms</title>
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body>

    <main class="container">
      <header class="page-head">
        <h1 class="page-title">Rooms</h1>
      </header>

      <div class="toolbar">
        <a class="btn" href="room_form.html">Add room</a>
      </div>

      <div class="rooms-table-wrap">
        <table class="rooms-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Capacity</th>
              <th>Status</th>
              <th>Classes</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Studio A</td>
              <td>20</td>
              <td><span class="status-pill status-active">active</span></td>
              <td>5</td>
              <td class="table-actions">
                <a class="btn btn-sm btn-ghost" href="room_form.html?id=1">Edit</a>
                <form
                  onsubmit="event.preventDefault(); if (confirm('Delete this room?')) alert('This static prototype has no backend, so the room was not deleted.');"
                >
                  <input type="hidden" name="delete_id" value="1" />
                  <button class="btn btn-sm btn-ghost" type="submit">Delete</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

  </body>
</html>
